<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t">
  <title id="t">Biggy, developer. I build applications, websites and games.</title>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .float { animation: float 7s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .pulse, .float { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="420" rx="18"/></clipPath>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="930" cy="210" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <radialGradient id="g0" cx="860" cy="240" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22c97f" stop-opacity=".13"/><stop offset="1" stop-color="#22c97f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g1" cx="930" cy="200" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f8485e" stop-opacity=".13"/><stop offset="1" stop-color="#f8485e" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="1000" cy="230" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2ea8f2" stop-opacity=".13"/><stop offset="1" stop-color="#2ea8f2" stop-opacity="0"/></radialGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#0b0e14"/>
    <rect width="1200" height="420" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1200" height="420" fill="url(#g0)"/>
    <rect width="1200" height="420" fill="url(#g1)"/>
    <rect width="1200" height="420" fill="url(#g2)"/>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#1f2633" stroke-width="2"/>

  <text x="80" y="138" class="mono" font-size="15" letter-spacing="3" fill="#8b95a5">DEVELOPER</text>
  <text x="74" y="224" class="sans" font-size="96" font-weight="700" letter-spacing="-2" fill="#f0f3f6">Biggy</text>
  <text x="80" y="272" class="sans" font-size="26" fill="#9aa4b2">I build applications, websites and games.</text>
  <rect x="80" y="300" width="20" height="3" fill="#22c97f"/><rect x="100" y="300" width="20" height="3" fill="#f8485e"/><rect x="120" y="300" width="20" height="3" fill="#2ea8f2"/>

  <g class="float">
    <g transform="translate(787.4 67.4) scale(0.62)">
    <defs>
      <linearGradient id="lg" x1="0" y1="160" x2="0" y2="293" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#34e3a0"/><stop offset="1" stop-color="#10b36a"/></linearGradient>
      <linearGradient id="lr" x1="0" y1="146" x2="0" y2="311" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff6f74"/><stop offset="1" stop-color="#f23a50"/></linearGradient>
      <linearGradient id="lb" x1="0" y1="160" x2="0" y2="296" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#48caff"/><stop offset="1" stop-color="#1494e3"/></linearGradient>
    </defs>
    <g fill="none" stroke="#f3f4f8" stroke-width="16" stroke-linecap="round">
      <path d="M142 62H348A50 50 0 0 1 398 112V322"/>
      <path d="M62 138V347A50 50 0 0 0 112 397H318"/>
    </g>
    <g stroke-linecap="round">
      <line x1="188" y1="178" x2="146" y2="275" stroke="url(#lg)" stroke-width="36"/>
      <line x1="257" y1="165" x2="205" y2="292" stroke="url(#lr)" stroke-width="38"/>
      <line x1="316" y1="177" x2="271" y2="279" stroke="url(#lb)" stroke-width="34"/>
    </g>
    </g>
  </g>
</svg>
